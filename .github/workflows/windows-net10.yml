name: Windows .NET 10
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/SyslogDecodeAll.sln -c Release
      - run: dotnet test src/SyslogDecode.Tests/SyslogDecode.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~SyslogParsingTests|FullyQualifiedName~RawDataAndStatusTests|FullyQualifiedName~Rfc5424GrammarTests|FullyQualifiedName~Rfc5424EncodingTests|FullyQualifiedName~Rfc3164CollectorTests"
      - run: dotnet run --project validation/Validation.csproj -c Release
